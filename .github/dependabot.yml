version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
      native-vision:
        patterns:
          - "org.bytedeco:*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
