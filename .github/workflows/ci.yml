name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Privacy guard
        run: ./gradlew --no-daemon privacyGuard

      - name: Check documentation links
        if: runner.os == 'Linux'
        run: python3 tools/check-doc-links.py

      - name: Build and test
        run: ./gradlew --no-daemon build -Pkeeply.strict=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/**'
          retention-days: 7

  package-macos:
    name: Package Keeply.app
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build macOS distribution
        run: ./gradlew --no-daemon :desktop:packageDistributionForCurrentOS

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Keeply-macos-dmg
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
