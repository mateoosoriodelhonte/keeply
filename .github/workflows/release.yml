name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: read

jobs:
  macos:
    name: Keeply.app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: apple-silicon
          # macos-13 was the Intel runner and no longer picks jobs up: a release
          # build sat queued on it indefinitely rather than failing. macos-15-intel
          # is its replacement.
          - runner: macos-15-intel
            arch: intel
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          # Temurin rather than any JDK: the Compose packager refuses some
          # distributions outright, and a Homebrew JDK produces broken bundles.
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: ./gradlew --no-daemon build privacyGuard -Pkeeply.strict=true

      - name: Build the application bundle
        run: ./gradlew --no-daemon :desktop:packageDistributionForCurrentOS

      - name: Name the disk image after its architecture
        run: |
          cd desktop/build/compose/binaries/main/dmg
          for f in *.dmg; do
            mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg"
          done
          ls -la

      - name: Upload the disk image
        uses: actions/upload-artifact@v7
        with:
          name: Keeply-${{ matrix.arch }}
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  attach:
    name: Attach to the release
    runs-on: ubuntu-latest
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Attach the disk images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" artifacts/*/*.dmg \
            --repo "${GITHUB_REPOSITORY}" --clobber
