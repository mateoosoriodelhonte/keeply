# Keeply dependency catalogue.
# Every entry here is free and open source. Keeply has no paid dependencies.
[versions]
kotlin = "2.4.20"
compose = "1.12.0"
coroutines = "1.11.0"
serialization = "1.11.0"
sqldelight = "2.3.2"
sqliteJdbc = "3.53.4.0"
javacpp = "1.5.14"
tesseract = "5.5.3-1.5.14"
leptonica = "1.87.0-1.5.14"
openblas = "0.3.34-1.5.14"
opencv = "4.14.0-1.5.14"
pdfbox = "3.0.8"
ktor = "3.5.2"
junit = "6.1.3"
slf4j = "2.0.19"
logback = "1.6.3"
turbine = "1.2.1"
spotless = "8.9.0"
ktlint = "1.8.0"
foojay = "1.0.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-primitive-adapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacpp" }
tesseract = { module = "org.bytedeco:tesseract", version.ref = "tesseract" }
tesseract-platform = { module = "org.bytedeco:tesseract-platform", version.ref = "tesseract" }
opencv = { module = "org.bytedeco:opencv", version.ref = "opencv" }
opencv-platform = { module = "org.bytedeco:opencv-platform", version.ref = "opencv" }
openblas = { module = "org.bytedeco:openblas", version.ref = "openblas" }
leptonica = { module = "org.bytedeco:leptonica", version.ref = "leptonica" }

pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Used by buildSrc convention plugins
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
kotlin-serializationGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
